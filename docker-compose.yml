version: '3.8'
networks:
  default:
    external: true
    name: shared-network
services:
  recognizer:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - default
    restart: always
    environment:
      AMQP__HOST: rabbitmq
      AMQP__PORT:  ${AMQP__PORT}
      AMQP__USERNAME: ${AMQP__USERNAME}
      AMQP__PASSWORD: ${AMQP__PASSWORD}
      S3__URL: ${S3__URL}
      S3__BUCKET_NAME: ${S3__BUCKET_NAME}
      S3__ACCESS_KEY: ${S3__ACCESS_KEY}
      S3__SECRET_KEY: ${S3__SECRET_KEY}
      LOG_LEVEL: ${LOG_LEVEL}
